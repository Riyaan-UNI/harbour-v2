<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbour</title>
    <!-- Dark is the default theme; theme.ts rewrites this on every change. -->
    <meta name="theme-color" content="#061b1a" />
    <script>
      // Spec §11, verbatim. Runs before paint so there is no flash of the
      // wrong theme. The mode is stored as a raw string under harbour:theme,
      // which is why it can be read here without any parsing.
      (function () {
        try {
          var s = localStorage.getItem('harbour:theme') || 'system';
          var d =
            s === 'dark' ||
            (s === 'system' &&
              matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.dataset.theme = d ? 'dark' : 'light';
          r.style.colorScheme = d ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
