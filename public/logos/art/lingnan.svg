<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Lingnan University">
<title>Lingnan University</title>
<defs>
<linearGradient id="ua-field" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#D70023" stop-opacity=".30"/>
<stop offset=".52" stop-color="#ffffff" stop-opacity=".90"/>
<stop offset="1" stop-color="#C2C2C2" stop-opacity=".30"/>
</linearGradient>
<!-- A ring-shaped bloom, not a disc: the colour peaks *around* the mark so it
     never tints the mark itself. Institutions whose own colour matches their
     accent (Lingnan's red, CityU's maroon) were washing out under a solid glow. -->
<radialGradient id="ua-halo" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#D70023" stop-opacity="0"/>
<stop offset=".34" stop-color="#D70023" stop-opacity=".12"/>
<stop offset=".68" stop-color="#D70023" stop-opacity=".46"/>
<stop offset="1" stop-color="#C2C2C2" stop-opacity="0"/>
</radialGradient>
<!-- A near-white bed under the mark, so the mark reads the same on every
     accent. Fades out at its own edge and stops short of the inner ring. -->
<radialGradient id="ua-bed" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#ffffff" stop-opacity=".97"/>
<stop offset=".62" stop-color="#ffffff" stop-opacity=".86"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="ua-ring" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#D70023" stop-opacity=".95"/>
<stop offset="1" stop-color="#C2C2C2" stop-opacity=".7"/>
</linearGradient>
</defs>
<style>
@keyframes ua-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes ua-spin-rev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes ua-breathe{0%,100%{opacity:.5;transform:scale(.94)}50%{opacity:1;transform:scale(1.07)}}
@keyframes ua-blink{0%,100%{opacity:.2}50%{opacity:.85}}
.ua-spin,.ua-spin-rev,.ua-breathe,.ua-blink{transform-box:view-box;transform-origin:100px 100px}
.ua-spin{animation:ua-spin 19s linear infinite}
.ua-spin-rev{animation:ua-spin-rev 29s linear infinite}
.ua-breathe{animation:ua-breathe 7s ease-in-out infinite}
.ua-blink{animation:ua-blink 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ua-spin,.ua-spin-rev,.ua-breathe,.ua-blink{animation:none}}
</style>
<rect width="200" height="200" fill="url(#ua-field)"/>
<circle class="ua-breathe" cx="100" cy="100" r="88" fill="url(#ua-halo)"/>
<g fill="none" stroke="url(#ua-ring)">
<circle cx="100" cy="100" r="90" stroke-opacity=".30" stroke-width="1"/>
<ellipse cx="100" cy="100" rx="90" ry="34" stroke-opacity=".62" stroke-width="1.3" transform="rotate(-19 100 100)"/>
<ellipse cx="100" cy="100" rx="90" ry="34" stroke-opacity=".42" stroke-width="1.3" transform="rotate(41 100 100)"/>
<circle cx="100" cy="100" r="68" stroke-opacity=".26" stroke-width="1"/>
</g>
<circle cx="100" cy="100" r="60" fill="url(#ua-bed)"/>
<g class="ua-spin">
<circle cx="190" cy="100" r="3.6" fill="#D70023"/>
<circle cx="10" cy="100" r="2.2" fill="#C2C2C2" opacity=".85"/>
</g>
<g class="ua-spin-rev">
<circle cx="100" cy="10" r="2.8" fill="#C2C2C2"/>
<circle cx="100" cy="190" r="1.9" fill="#D70023" opacity=".75"/>
</g>
<g class="ua-blink"><circle cx="100" cy="100" r="96" fill="none" stroke="#D70023" stroke-opacity=".4" stroke-width="1"/></g>
<g transform="translate(40 40) scale(0.737)"><defs
