<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:svg="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="The Hong Kong University of Science and Technology">
<title>The Hong Kong University of Science and Technology</title>
<defs>
<linearGradient id="ua-field" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#003974" stop-opacity=".30"/>
<stop offset=".52" stop-color="#ffffff" stop-opacity=".90"/>
<stop offset="1" stop-color="#A68137" stop-opacity=".30"/>
</linearGradient>
<!-- A ring-shaped bloom, not a disc: the colour peaks *around* the mark so it
     never tints the mark itself. Institutions whose own colour matches their
     accent (Lingnan's red, CityU's maroon) were washing out under a solid glow. -->
<radialGradient id="ua-halo" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#003974" stop-opacity="0"/>
<stop offset=".34" stop-color="#003974" stop-opacity=".12"/>
<stop offset=".68" stop-color="#003974" stop-opacity=".46"/>
<stop offset="1" stop-color="#A68137" stop-opacity="0"/>
</radialGradient>
<!-- A near-white bed under the mark, so the mark reads the same on every
     accent. Fades out at its own edge and stops short of the inner ring. -->
<radialGradient id="ua-bed" cx="50%" cy="50%" r="50%">
<stop offset="0" stop-color="#ffffff" stop-opacity=".97"/>
<stop offset=".62" stop-color="#ffffff" stop-opacity=".86"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="ua-ring" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#003974" stop-opacity=".95"/>
<stop offset="1" stop-color="#A68137" stop-opacity=".7"/>
</linearGradient>
</defs>
<style>
@keyframes ua-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes ua-spin-rev{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
@keyframes ua-breathe{0%,100%{opacity:.5;transform:scale(.94)}50%{opacity:1;transform:scale(1.07)}}
@keyframes ua-blink{0%,100%{opacity:.2}50%{opacity:.85}}
.ua-spin,.ua-spin-rev,.ua-breathe,.ua-blink{transform-box:view-box;transform-origin:100px 100px}
.ua-spin{animation:ua-spin 19s linear infinite}
.ua-spin-rev{animation:ua-spin-rev 29s linear infinite}
.ua-breathe{animation:ua-breathe 7s ease-in-out infinite}
.ua-blink{animation:ua-blink 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ua-spin,.ua-spin-rev,.ua-breathe,.ua-blink{animation:none}}
</style>
<rect width="200" height="200" fill="url(#ua-field)"/>
<circle class="ua-breathe" cx="100" cy="100" r="88" fill="url(#ua-halo)"/>
<g fill="none" stroke="url(#ua-ring)">
<circle cx="100" cy="100" r="90" stroke-opacity=".30" stroke-width="1"/>
<ellipse cx="100" cy="100" rx="90" ry="34" stroke-opacity=".62" stroke-width="1.3" transform="rotate(-19 100 100)"/>
<ellipse cx="100" cy="100" rx="90" ry="34" stroke-opacity=".42" stroke-width="1.3" transform="rotate(41 100 100)"/>
<circle cx="100" cy="100" r="68" stroke-opacity=".26" stroke-width="1"/>
</g>
<circle cx="100" cy="100" r="60" fill="url(#ua-bed)"/>
<g class="ua-spin">
<circle cx="190" cy="100" r="3.6" fill="#003974"/>
<circle cx="10" cy="100" r="2.2" fill="#A68137" opacity=".85"/>
</g>
<g class="ua-spin-rev">
<circle cx="100" cy="10" r="2.8" fill="#A68137"/>
<circle cx="100" cy="190" r="1.9" fill="#003974" opacity=".75"/>
</g>
<g class="ua-blink"><circle cx="100" cy="100" r="96" fill="none" stroke="#003974" stroke-opacity=".4" stroke-width="1"/></g>
<g transform="translate(61 40) scale(0.2)"><path fill="#A68137" d="M275.387,125.75c2.789-3.484,3.751-9.706,3.751-9.706H112.028c0,0,2.062,6.893,3.806,9.706H275.387z"/><path fill="#A68137" d="M265.683,139.927c3.103-2.763,6.272-8.312,6.272-8.312H118.92c0,0,1.718,4.156,5.549,8.312H265.683z"/><path fill="#A68137" d="M253.604,152.752c3.782-2.065,6.903-6.255,6.903-6.255H129.672c0,0,3.11,3.484,6.196,6.255H253.604z"/><path fill="#A68137" d="M238.324,164.864c3.781-1.418,7.964-4.87,7.964-4.87H144.23c0,0,0,0.747,7.241,4.87H238.324z"/><path fill="#A68137" d="M163.219,172.454c0,0,10.752,6.28,31.854,6.28c21.134,0,34.59-6.28,34.59-6.28H163.219z"/><path fill="#003974" d="M161.502,186.665c0,0,12.816,0.672,20.382,6.553c7.293,6.264,12.842,16.616,12.842,16.616 s4.504-9.979,11.791-15.198c7.252-5.582,19.049-7.971,19.049-7.971h131.867l25.965,38.424H264.984c0,0-8.293,0.333-20.755,7.649 c-6.603,3.749-11.48,10.345-11.48,10.345s-0.963,3.119-2.389,4.812c-1.395,1.767-2.439,3.177-4.133,3.824 c-1.758,0.747-1.393,0.332-1.393,0.332h-61.616c0,0-2.488-0.979-3.784-3.111c-1.392-2.065-0.372-1.352-1.741-3.045 c-1.045-1.716-3.483-6.262-12.817-12.484c-9.68-6.296-19.039-6.927-19.039-6.927H5.436l26.23-39.819H161.502z"/><path fill="#003974" d="M68.35,240.993v196.59c0,0,0.696,17.37,15.256,40.863c14.533,23.544,35.613,34.294,35.613,34.294 l16.649-25.957c0,0-14.509-8.685-25.607-25.309c-10.703-16.574-10.703-30.812-10.703-30.812v-189.67H68.35z"/><path fill="#003974" d="M291.282,240.32v189.647c0,0-2.405,19.062-11.415,32.552c-9.008,13.837-23.923,24.937-23.923,24.937 l16.011,25.584c0,0,24.189-17.621,35.936-36.335c11.797-18.665,14.601-46.737,14.601-46.737V240.32H291.282z"/><path fill="#003974" d="M18.925,240.993v197.311c0,0,2.041,30.487,21.054,62.318c19.113,31.804,53.656,53.979,53.656,53.979 l16.301-25.932c0,0-22.174-11.771-39.794-38.823c-18.068-27.326-19.038-52.263-19.038-52.263v-196.59H18.925z"/><path fill="#A68137" d="M161.502,261.756v208.378c0,0-0.771,0.722-1.021,3.783c-0.374,3.161-2.438,5.251-2.438,5.251 L88.483,59