<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The tab icon. Geometry is public/harbour-mark.svg unchanged; the two
       colour sets below are the same token mapping the HarbourMark component
       uses, selected by the browser's own colour scheme rather than by
       `data-theme` — a favicon has no access to the page.

       Without this the icon is a dark-teal disc, which is nearly invisible on
       a dark browser tab strip. The archived original at
       src/assets/brand/original/favicon.svg is untouched.

         light   --accent-fill #0B3935   --on-accent #F2F7F6   --aurora-1 #BFE5E2
         dark    --accent-fill #4FE3D0   --on-accent #04201D   --aurora-1 #0F6B63 -->
  <style>
    :root {
      --disc: #0b3935;
      --ink: #f2f7f6;
      --wave: #bfe5e2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --disc: #4fe3d0;
        --ink: #04201d;
        --wave: #0f6b63;
      }
    }
  </style>
  <circle cx="64" cy="64" r="61" fill="var(--disc)"/>
  <circle cx="64" cy="31" r="7" fill="var(--ink)"/>
  <path d="M39 43v35M89 43v35" fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-width="7"/>
  <path d="M39 60c8-5 16-7 25-7s17 2 25 7" fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-width="7"/>
  <path d="M22 84c13-8 27-8 42 0s29 8 42 0" fill="none" stroke="var(--wave)" stroke-linecap="round" stroke-width="6"/>
  <path d="M31 99c10-5 21-5 33 0s23 5 33 0" fill="none" stroke="var(--ink)" stroke-linecap="round" stroke-width="4" opacity=".85"/>
</svg>
